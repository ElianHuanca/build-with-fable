<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>Dengue Invaders 2D</title>
  <style>
    html, body { margin: 0; padding: 0; background: #2c3e50; height: 100%; overflow: hidden; touch-action: none; }
    #game { width: 100%; height: 100%; }
    /* Aviso "Gira tu dispositivo" (lo muestra src/main.js en pantallas táctiles en vertical). */
    #rotate { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
      background: #2c3e50; color: #fff; font: bold 22px/1.3 Arial, sans-serif; }
    #rotate[hidden] { display: none; }
    #rotate .phone { width: 46px; height: 82px; border: 4px solid #7fd3ff; border-radius: 10px;
      animation: rotate-hint 1.6s ease-in-out infinite; }
    #rotate small { font-weight: normal; font-size: 15px; color: #cfe8f7; }
    #rotate button { margin-top: 8px; min-height: 44px; padding: 10px 22px; border: 0; border-radius: 12px;
      background: #7fd3ff; color: #2c3e50; font: bold 16px Arial, sans-serif; }
    @keyframes rotate-hint { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" hidden>
    <div class="phone"></div>
    <div>Gira tu dispositivo</div>
    <small>El juego se ve mejor en horizontal.</small>
    <button type="button" id="rotate-skip">Jugar así de todos modos</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
